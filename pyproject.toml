[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-scanner-helper"
version = "2.1.0"
description = "Inventário de rede para Windows com evidências de identificação e mapas offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.10,<7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
ip-scanner-helper = "ip_scanner_helper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ip_scanner_helper*"]
namespaces = false

[tool.setuptools.package-data]
"ip_scanner_helper.presentation" = ["assets/*.png", "assets/*.ico", "qml/*.qml", "qml/qmldir"]
"ip_scanner_helper.resources" = ["*.json", "templates/*.html", "templates/*.js"]
