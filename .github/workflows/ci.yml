name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package and desktop dependencies
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Desktop smoke test (mocked network)
        run: python scripts/smoke_ui.py
      - name: Preferences smoke test (temporary settings)
        run: python scripts/smoke_preferences.py
      - name: Navigation and appearance smoke test (temporary settings)
        run: python scripts/smoke_navigation.py
      - name: Credential vault smoke test (synthetic DPAPI data)
        run: python scripts/smoke_vault.py
      - name: Offline topology smoke test (local headless browser)
        run: python scripts/smoke_topology.py
      - name: L2 dialog smoke test (simulated SNMP data)
        run: python scripts/smoke_l2.py
      - name: History smoke test (temporary SQLite data)
        run: python scripts/smoke_history.py
