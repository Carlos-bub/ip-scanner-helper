name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and desktop dependencies
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Desktop smoke test (mocked network)
        run: python scripts/smoke_ui.py
      - name: Preferences smoke test (temporary settings)
        run: python scripts/smoke_preferences.py
      - name: Credential vault smoke test (synthetic DPAPI data)
        run: python scripts/smoke_vault.py
